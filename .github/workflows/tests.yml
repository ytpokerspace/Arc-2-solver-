name: ARC-R2 checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q arc_r2 tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic CLI smoke test
        run: python -m arc_r2.cli --demo --output /tmp/arc-r2-smoke
      - name: Object DSL CLI smoke test
        run: python -m arc_r2.cli --demo --engine object --candidate-cap 300 --output /tmp/arc-r2-object-smoke
