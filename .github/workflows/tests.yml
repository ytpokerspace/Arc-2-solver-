name: ARC-R2 primitive-first checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q arc_r2 tests benchmarks
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Glyphic memory benchmark smoke test
        run: python -m benchmarks.benchmark_glyphic_path_memory --paths 25 --queries 10
