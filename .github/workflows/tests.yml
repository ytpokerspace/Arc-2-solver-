name: ARC-R2 primitive-first checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q arc_r2 tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run controlled semantic identity preflight
        run: >-
          python -m arc_r2.semantic_identity_experiment
          --output semantic_identity_experiment.json
      - name: Upload semantic identity preflight report
        uses: actions/upload-artifact@v4
        with:
          name: semantic-identity-preflight
          path: semantic_identity_experiment.json
          if-no-files-found: error
      - name: Run semantic identity stress matrix and publish summary
        run: |
          python -m arc_r2.semantic_identity_stress \
            --output semantic_identity_stress.json \
            --summary semantic_identity_stress.md
          cat semantic_identity_stress.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload semantic identity stress matrix reports
        uses: actions/upload-artifact@v4
        with:
          name: semantic-identity-stress-matrix
          path: |
            semantic_identity_stress.json
            semantic_identity_stress.md
          if-no-files-found: error
      - name: Run 250 seeded randomized identity trials
        run: |
          python -m arc_r2.semantic_identity_randomized \
            --seed 20261124 \
            --trials 250 \
            --output semantic_identity_randomized.json \
            --summary semantic_identity_randomized.md
          cat semantic_identity_randomized.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload randomized identity reports
        uses: actions/upload-artifact@v4
        with:
          name: semantic-identity-randomized
          path: |
            semantic_identity_randomized.json
            semantic_identity_randomized.md
          if-no-files-found: error
      - name: Run ARC-AGI-2 training-pair identity association
        run: |
          python -m arc_r2.semantic_identity_arc_fixture \
            --task-json tests/fixtures/arc_agi2_d89b689b_train.json \
            --output semantic_identity_arc_fixture.json \
            --summary semantic_identity_arc_fixture.md
          cat semantic_identity_arc_fixture.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ARC training-pair identity report
        uses: actions/upload-artifact@v4
        with:
          name: semantic-identity-arc-training-pairs
          path: |
            semantic_identity_arc_fixture.json
            semantic_identity_arc_fixture.md
          if-no-files-found: error
      - name: Run 250 same-color shape-based identity trials
        run: |
          python -m arc_r2.semantic_identity_same_color \
            --seed 20261125 \
            --trials 250 \
            --output semantic_identity_same_color.json \
            --summary semantic_identity_same_color.md
          cat semantic_identity_same_color.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload same-color identity reports
        uses: actions/upload-artifact@v4
        with:
          name: semantic-identity-same-color
          path: |
            semantic_identity_same_color.json
            semantic_identity_same_color.md
          if-no-files-found: error
      - name: Run pinned Shape Radar + HMSE ARC demonstration
        run: >-
          python -m arc_r2.hmse_demo
          --task-json tests/fixtures/arc_agi2_00d62c1b_train.json
          --candidate-cap 1500
          --max-depth 2
          --output arc_hmse_demo.json
      - name: Run pinned spatial Shape Radar + HMSE ARC demonstration
        run: >-
          python -m arc_r2.hmse_spatial_demo
          --task-json tests/fixtures/arc_agi2_d89b689b_train.json
          --candidate-cap 1500
          --max-depth 2
          --output arc_hmse_spatial_demo.json
      - name: Run four-family Shape Radar + HMSE rule selector
        run: >-
          python -m arc_r2.hmse_rule_selector
          --task-json tests/fixtures/arc_agi2_00d62c1b_train.json
          --task-json tests/fixtures/arc_agi2_d89b689b_train.json
          --task-json tests/fixtures/synthetic_reflection_train.json
          --task-json tests/fixtures/arc_agi2_4cd1b7b2_train.json
          --candidate-cap 1500
          --max-depth 2
          --output arc_hmse_selector_report.json
      - name: Upload four-family HMSE rule selector report
        uses: actions/upload-artifact@v4
        with:
          name: arc-hmse-four-family-rule-selector
          path: arc_hmse_selector_report.json
          if-no-files-found: error
      - name: Upload reproducible spatial HMSE demonstration report
        uses: actions/upload-artifact@v4
        with:
          name: arc-hmse-spatial-demo-task-d89b689b
          path: arc_hmse_spatial_demo.json
          if-no-files-found: error
      - name: Upload reproducible HMSE demonstration report
        uses: actions/upload-artifact@v4
        with:
          name: arc-hmse-demo-task-00d62c1b
          path: arc_hmse_demo.json
          if-no-files-found: error
      - name: Run three-way HMSE identity spatial comparison
        run: >-
          python -m arc_r2.hmse_identity_spatial
          --task-json tests/fixtures/arc_agi2_d89b689b_train.json
          --candidate-cap 1500
          --max-depth 2
          --output arc_hmse_identity_spatial.json
      - name: Upload three-way HMSE identity spatial report
        uses: actions/upload-artifact@v4
        with:
          name: arc-hmse-identity-spatial-three-way
          path: arc_hmse_identity_spatial.json
          if-no-files-found: error

      - name: Run full orchestration leave-one-out comparison on pinned ARC fixtures
        run: >-
          python -m arc_r2.full_orchestration_benchmark
          --dataset tests/fixtures
          --limit 3
          --candidate-cap 150
          --max-depth 1
          --output full_orchestration_fixture_report.json
      - name: Upload full orchestration comparison report
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-full-orchestration-fixture-comparison
          path: full_orchestration_fixture_report.json
          if-no-files-found: error

      - name: Check out pinned public ARC-AGI-2 training data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          ref: f3283f727488ad98fe575ea6a5ac981e4a188e49
          path: arc-agi-2-data
      - name: Run full orchestration comparison on 20 pinned public training tasks
        run: >-
          python -m arc_r2.full_orchestration_benchmark
          --dataset arc-agi-2-data/data/training
          --limit 20
          --candidate-cap 500
          --max-depth 2
          --output full_orchestration_20_task_report.json
      - name: Publish full orchestration comparison summary
        run: |
          python - <<'PY'
          import json
          import os
          report = json.load(open("full_orchestration_20_task_report.json", encoding="utf-8"))
          full = report["full_orchestration"]
          baseline = report["primitive_baseline"]
          lines = [
              "## Full ARC orchestration vs primitive baseline (20-task subset)",
              f"- Tasks considered: {report['tasks_considered']}",
              f"- Eligible tasks: {report['eligible_tasks']}",
              f"- Held-out folds: {report['folds']}",
              f"- Full orchestration: {full['held_out_exact']} exact; {full['held_out_accuracy']:.2%} accuracy; {full['abstentions']} abstentions",
              f"- Primitive baseline: {baseline['held_out_exact']} exact; {baseline['held_out_accuracy']:.2%} accuracy; {baseline['abstentions']} abstentions",
              f"- Accuracy delta: {report['accuracy_delta_full_minus_baseline']:+.2%}",
              f"- Runtime: full {full['runtime_seconds_total']:.3f}s; baseline {baseline['runtime_seconds_total']:.3f}s",
              f"- Hidden evaluation outputs read: {report['hidden_test_outputs_read']}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Upload 20-task full orchestration comparison report
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-full-orchestration-20-task-comparison
          path: full_orchestration_20_task_report.json
          if-no-files-found: error
