name: ARC-R2 primitive-first checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q arc_r2 tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run pinned Shape Radar + HMSE ARC demonstration
        run: >-
          python -m arc_r2.hmse_demo
          --task-json tests/fixtures/arc_agi2_00d62c1b_train.json
          --candidate-cap 1500
          --max-depth 2
          --output arc_hmse_demo.json
      - name: Upload reproducible HMSE demonstration report
        uses: actions/upload-artifact@v4
        with:
          name: arc-hmse-demo-task-00d62c1b
          path: arc_hmse_demo.json
          if-no-files-found: error
