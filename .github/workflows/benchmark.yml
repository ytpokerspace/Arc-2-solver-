name: ARC-R2 primitive-only public training benchmark
on:
  push:
    branches: [main]
    paths:
      - "arc_r2/primitives.py"
      - "arc_r2/predictive_mcts.py"
      - "arc_r2/predictive_mcts_benchmark.py"
      - "arc_r2/primitive_benchmark.py"
      - "arc_r2/hcm32.py"
      - "arc_r2/hcm32_bridge.py"
      - "arc_r2/hcm32_transfer_benchmark.py"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "arc_r2/primitives.py"
      - "arc_r2/primitive_benchmark.py"
      - "arc_r2/hcm32.py"
      - "arc_r2/hcm32_bridge.py"
      - "arc_r2/hcm32_transfer_benchmark.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      task_limit:
        description: "Number of public ARC-AGI-2 training tasks for the existing benchmarks"
        required: false
        default: "20"
      transfer_task_limit:
        description: "Number of public ARC-AGI-2 tasks for the task-disjoint HCM-32 transfer experiment"
        required: false
        default: "1000"
      run_official_evaluation:
        description: "Run the full 120-task ARC-AGI-2 evaluation-input prediction pass (no labels or solver memory)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  primitive-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ARC-R2 solver
        uses: actions/checkout@v4
      - name: Check out pinned public ARC-AGI-2 training data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          ref: f3283f727488ad98fe575ea6a5ac981e4a188e49
          path: arc-agi-2-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore single-stage rule memory
        uses: actions/cache@v4
        with:
          path: .arc_r2_single_stage_memory.json
          key: arc-r2-single-stage-memory-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            arc-r2-single-stage-memory-${{ github.ref_name }}-
            arc-r2-single-stage-memory-
      - name: Run deterministic primitive benchmark (no MCTS, no beam search)
        env:
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '20' }}
        run: python -m arc_r2.primitive_benchmark --dataset arc-agi-2-data/data/training --limit "$TASK_LIMIT" --max-depth 2 --candidate-cap 1500 --memory .arc_r2_single_stage_memory.json --output arc_r2_primitive_benchmark.json
      - name: Upload primitive benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-primitive-benchmark
          path: arc_r2_primitive_benchmark.json
          if-no-files-found: warn

      - name: Run task-disjoint HCM-32 transfer benchmark
        env:
          TRANSFER_TASK_LIMIT: ${{ github.event.inputs.transfer_task_limit || '1000' }}
        run: >-
          python -m arc_r2.hcm32_transfer_benchmark
          --dataset arc-agi-2-data/data/training
          --limit "$TRANSFER_TASK_LIMIT"
          --max-depth 1
          --candidate-cap 1500
          --memory hcm32_transfer_memory.json
          --output arc_r2_hcm32_transfer_benchmark.json
      - name: Upload task-disjoint HCM-32 transfer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-hcm32-task-disjoint-transfer
          path: arc_r2_hcm32_transfer_benchmark.json
          if-no-files-found: warn

      - name: Run predictive pair-matching MCTS benchmark
        env:
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '20' }}
        run: python -m arc_r2.predictive_mcts_benchmark --dataset arc-agi-2-data/data/training --limit "$TASK_LIMIT" --iterations 40 --branch-width 10 --max-depth 3 --memory .arc_r2_predictive_mcts_memory.json --output arc_r2_predictive_mcts_benchmark.json
      - name: Upload predictive MCTS benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-predictive-mcts-benchmark
          path: arc_r2_predictive_mcts_benchmark.json
          if-no-files-found: warn

  official-evaluation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_official_evaluation == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ARC-R2 solver
        uses: actions/checkout@v4
      - name: Check out pinned official ARC-AGI-2 dataset
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          ref: f3283f727488ad98fe575ea6a5ac981e4a188e49
          path: arc-agi-2-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Predict on every official evaluation input (labels untouched)
        run: >-
          python -m arc_r2.evaluation_benchmark
          --dataset arc-agi-2-data/data/evaluation
          --candidate-cap 1500
          --max-depth 2
          --output arc_r2_evaluation_predictions.json
          --report arc_r2_evaluation_report.json
      - name: Publish evaluation coverage summary
        run: |
          python - <<'PY'
          import json
          import os
          report = json.load(open("arc_r2_evaluation_report.json", encoding="utf-8"))
          lines = [
              "## ARC-AGI-2 official evaluation inputs",
              f"- Tasks: {report['task_count']}",
              f"- Test inputs: {report['test_input_count']}",
              f"- Predictions: {report['predictions_produced']}",
              f"- Abstentions: {report['abstentions']}",
              "- Accuracy: not measured; test labels are not present/read.",
              "- Semantic identity: not integrated into this baseline.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\\n".join(lines) + "\\n")
          PY
      - name: Upload blind evaluation predictions and report
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-official-evaluation-input-predictions
          path: |
            arc_r2_evaluation_predictions.json
            arc_r2_evaluation_report.json
          if-no-files-found: error
