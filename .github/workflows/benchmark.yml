name: ARC-R2 primitive and validation benchmarks
on:
  push:
    branches: [main]
    paths:
      - "arc_r2/primitives.py"
      - "arc_r2/predictive_mcts.py"
      - "arc_r2/predictive_mcts_benchmark.py"
      - "arc_r2/primitive_benchmark.py"
      - "arc_r2/validation.py"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "arc_r2/primitives.py"
      - "arc_r2/primitive_benchmark.py"
      - "arc_r2/validation.py"
      - "tests/test_validation.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      task_limit:
        description: "Number of public ARC-AGI-2 training tasks"
        required: false
        default: "20"
permissions:
  contents: read
jobs:
  primitive-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ARC-R2 solver
        uses: actions/checkout@v4
      - name: Check out pinned public ARC-AGI-2 training data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          ref: f3283f727488ad98fe575ea6a5ac981e4a188e49
          path: arc-agi-2-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore single-stage rule memory
        uses: actions/cache@v4
        with:
          path: .arc_r2_single_stage_memory.json
          key: arc-r2-single-stage-memory-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            arc-r2-single-stage-memory-${{ github.ref_name }}-
            arc-r2-single-stage-memory-
      - name: Run deterministic primitive benchmark (no MCTS, no beam search)
        env:
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '20' }}
        run: python -m arc_r2.primitive_benchmark --dataset arc-agi-2-data/data/training --limit "$TASK_LIMIT" --max-depth 2 --candidate-cap 1500 --memory .arc_r2_single_stage_memory.json --output arc_r2_primitive_benchmark.json
      - name: Upload primitive benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-primitive-benchmark
          path: arc_r2_primitive_benchmark.json
          if-no-files-found: warn
      - name: Run predictive pair-matching MCTS benchmark
        env:
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '20' }}
        run: python -m arc_r2.predictive_mcts_benchmark --dataset arc-agi-2-data/data/training --limit "$TASK_LIMIT" --iterations 40 --branch-width 10 --max-depth 3 --memory .arc_r2_predictive_mcts_memory.json --output arc_r2_predictive_mcts_benchmark.json
      - name: Upload predictive MCTS benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-predictive-mcts-benchmark
          path: arc_r2_predictive_mcts_benchmark.json
          if-no-files-found: warn
      - name: Run matched validation controls on public training data
        env:
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '20' }}
          ARC_DATASET_REPOSITORY: arcprize/ARC-AGI-2
          ARC_DATASET_REVISION: f3283f727488ad98fe575ea6a5ac981e4a188e49
        run: |
          python -m arc_r2.validation \
            --dataset arc-agi-2-data/data/training \
            --limit "$TASK_LIMIT" \
            --max-depth 2 \
            --candidate-cap 500 \
            --mcts-iterations 20 \
            --variant identity \
            --variant mcts \
            --variant hybrid \
            --output arc_r2_validation.json
      - name: Upload reproducible validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-leave-one-out-validation
          path: arc_r2_validation.json
          if-no-files-found: warn

      - name: Run unified ARC-2 validation on the same public training tasks
        env:
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '20' }}
          ARC_DATASET_REPOSITORY: arcprize/ARC-AGI-2
          ARC_DATASET_REVISION: f3283f727488ad98fe575ea6a5ac981e4a188e49
        run: |
          python -m arc_r2.unified_engine \
            --mode validate \
            --dataset arc-agi-2-data/data/training \
            --limit "$TASK_LIMIT" \
            --primitive-candidate-cap 1500 \
            --primitive-max-depth 2 \
            --mcts-iterations 40 \
            --mcts-branch-width 10 \
            --mcts-max-depth 3 \
            --output arc2_unified_validation.json
      - name: Upload unified ARC-2 validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc2-unified-validation
          path: arc2_unified_validation.json
          if-no-files-found: warn
