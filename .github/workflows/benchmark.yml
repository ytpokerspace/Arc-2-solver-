name: ARC-R2 primitive-only public training benchmark
on:
  push:
    branches: [main]
    paths:
      - "arc_r2/primitives.py"
      - "arc_r2/primitive_benchmark.py"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "arc_r2/primitives.py"
      - "arc_r2/primitive_benchmark.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      task_limit:
        description: "Number of public ARC-AGI-2 training tasks"
        required: false
        default: "5"
permissions:
  contents: read
jobs:
  primitive-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ARC-R2 solver
        uses: actions/checkout@v4
      - name: Check out pinned public ARC-AGI-2 training data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          ref: f3283f727488ad98fe575ea6a5ac981e4a188e49
          path: arc-agi-2-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic primitive benchmark (no MCTS, no beam search)
        env:
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '20' }}
        run: python -m arc_r2.primitive_benchmark --dataset arc-agi-2-data/data/training --limit "$TASK_LIMIT" --max-depth 2 --candidate-cap 1500 --output arc_r2_primitive_benchmark.json
      - name: Upload primitive benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-primitive-benchmark
          path: arc_r2_primitive_benchmark.json
          if-no-files-found: warn
