name: ARC-R2 public training comparison
on:
  push:
    branches: [main]
    paths:
      - "arc_r2/compare_engines.py"
      - "arc_r2/solver.py"
      - "arc_r2/search.py"
      - "arc_r2/quantum_brainstorming.py"
      - "arc_r2/cli.py"
      - "tests/**"
      - "arc_r2/object_solver.py"
      - "arc_r2/object_dsl.py"
      - "arc_r2/object_quantum_brainstorming.py"
      - "arc_r2/object_dsl.py"
      - "arc_r2/object_quantum_brainstorming.py"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "arc_r2/compare_engines.py"
      - "arc_r2/solver.py"
      - "arc_r2/search.py"
      - "arc_r2/quantum_brainstorming.py"
      - "arc_r2/cli.py"
      - "tests/**"
      - "arc_r2/object_solver.py"
      - "arc_r2/object_dsl.py"
      - "arc_r2/object_quantum_brainstorming.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      task_limit:
        description: "Number of public training tasks to sample"
        required: false
        default: "20"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ARC-R2 solver
        uses: actions/checkout@v4
      - name: Check out pinned official ARC-AGI-2 training data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          ref: f3283f727488ad98fe575ea6a5ac981e4a188e49
          path: arc-agi-2-data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run correctness and Quantum Brainstorming gates
        run: |
          python -m unittest discover -s tests -v
          python -m arc_r2.cli --demo --strategy qbs --max-depth 2 --candidate-cap 500 --output qbs-smoke
      - name: Record benchmark source and run paired comparison
        env:
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '20' }}
        run: |
          echo "ARC-AGI-2 source commit: f3283f727488ad98fe575ea6a5ac981e4a188e49"
          python -m arc_r2.compare_engines \
            --dataset arc-agi-2-data/data/training \
            --limit "$TASK_LIMIT" \
            --max-depth 2 \
            --candidate-cap 500 \
            --output arc_r2_engine_comparison.json
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r2-engine-comparison
          path: arc_r2_engine_comparison.json
          if-no-files-found: warn
